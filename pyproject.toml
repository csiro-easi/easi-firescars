[project]
name = "easi-firescars"
version = "0.1.0"
description = "Fine-tuning OLMo Earth for Australian firescar segmentation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "timm>=1.0",
    "pyyaml",
    "zarr>=3.0",
    "numpy",
    "odc-stac>=0.5",
    "pystac-client>=0.7",
    "s3fs",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["firescars"]
